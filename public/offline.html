<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - DishaSetu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      color: #1a7a6d;
    }
    h1 {
      color: #1a7a6d;
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .features {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .features h3 {
      color: #1a7a6d;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .features ul {
      list-style: none;
      text-align: left;
    }
    .features li {
      padding: 8px 0;
      color: #374151;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .features li::before {
      content: "✓";
      color: #1a7a6d;
      font-weight: bold;
    }
    button {
      background: #1a7a6d;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #156457;
    }
    .mesh-info {
      margin-top: 24px;
      padding: 16px;
      background: #fef3c7;
      border-radius: 8px;
      font-size: 14px;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
    </svg>
    <h1>You're Offline</h1>
    <p>Don't worry! DishaSetu works offline too. You can still access:</p>
    
    <div class="features">
      <h3>Available Offline</h3>
      <ul>
        <li>Career Mapping Hub</li>
        <li>Aptitude Quiz</li>
        <li>Saved Scholarships</li>
        <li>Downloaded Resources</li>
      </ul>
    </div>
    
    <button onclick="window.location.reload()">Try Again</button>
    
    <div class="mesh-info">
      <strong>Tip:</strong> Enable Bluetooth Mesh Sync to share data with nearby devices even without internet!
    </div>
  </div>
  
  <script>
    // Auto-reload when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
